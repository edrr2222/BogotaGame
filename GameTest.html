ca que se escapa de los\nbares, gente que se arregla frente a las vitrinas como si la calle\nfuera un espejo."}, "extra_raw": "En la puerta de un local, un grupo hace una colecta de ropa y plata\npara un chico al que su familia echó de la casa hace unos días."}, {"id": "Chapinero: Colaborar", "location": "Chapinero", "choices": [{"text": "Seguir caminando", "target": "Chapinero: Fiesta"}], "text": {"day": "Te detienes un momento, aunque vas de afán como todo el mundo a esta\nhora. Dejas algo de plata y sigues, sin mucho tiempo para quedarte a\nescuchar más.", "night": "Te detienes, en medio del ruido y las luces, preguntas qué necesita,\ndejas algo de plata. Alguien del grupo te cuenta la historia sin que\nse la pidas, como si la noche hiciera más fácil hablar de lo que\nduele."}, "effects": {"day": {"tolerancia": 1}, "night": {"tolerancia": 2}}, "extra_raw": "Algo en la entidad se afloja un poco, como un puño que se abre."}, {"id": "Chapinero: Seguir", "location": "Chapinero", "choices": [{"text": "Seguir caminando", "target": "Chapinero: Fiesta"}], "text": {"day": "Sigues de largo, apurado. Ni siquiera te detienes a mirar bien de qué\nse trata.", "night": "Aceleras el paso entre la música y las luces. Alcanzas a pensar \"eso\nno es asunto mío\" antes de perderte entre la gente que sale a\nrumbear."}, "effects": {"day": {"tolerancia": -1}, "night": {"tolerancia": -2}}, "extra_raw": "La calle sigue igual, como si nada hubiera pasado — porque para ti,\nnada pasó."}, {"id": "Chapinero: Fiesta", "location": "Chapinero", "choices": [{"text": "Decirle que no te parece gracioso", "target": "Chapinero: Defender"}, {"text": "Reírte también, para no incomodar", "target": "Chapinero: Reír"}], "mood_reaction": {"condition": "$tolerancia > 0", "text_true": "La entidad, todavía sin cara, siente el comentario como un ruido fuera\nde lugar — algo que no encaja con lo que empezó a sentir hace un\nmomento.", "text_false": "La entidad no reacciona todavía a comentarios así. Los regis const NODE_BY_ID = {};
STORY_NODES.forEach(n => NODE_BY_ID[n.id] = n);

/* ============================================================
   TOKENS DE DISEÑO
   ============================================================ */
const PALETTE = {
  night:      0x14162b,
  night2:     0x1f2244,
  day:        0xe9e2d0,
  day2:       0xd8cdb2,
  ink:        0xece7dd,
  inkDim:     0xb9b3a6,
  accentWarm: 0xf2a03d,   // amarillo buseta / taxi
  accentCool: 0x4fd1c5,   // rasgo positivo
  accentRust: 0xc1440e,   // rasgo negativo
  panelNight: 0x1a1c38,
  panelDay:   0xf4efe2,
};
const FONT_DISPLAY = "'Barlow Condensed', sans-serif";
const FONT_BODY    = "'Source Serif 4', serif";
const FONT_MONO    = "'IBM Plex Mono', monospace";

const STAT_ORDER = ["tolerancia","memoria","empatia","solidaridad","confianza","autenticidad","conciencia","legalidad"];

const LOCATIONS = ["Chapinero","La Candelaria","San Cristóbal","Kennedy","Ciudad Bolívar","Suba","Puente Aranda","Usme"];
const STAT_BY_LOCATION = {
  "Chapinero":"tolerancia","La Candelaria":"memoria","San Cristóbal":"empatia","Kennedy":"solidaridad",
  "Ciudad Bolívar":"confianza","Suba":"autenticidad","Puente Aranda":"conciencia","Usme":"legalidad"
};

const TRAITS = {
  solidaridad:  { pos:"solidaria",                         neg:"fría con los desconocidos" },
  tolerancia:   { pos:"abierta a lo distinto",              neg:"incómoda con lo que no le es familiar" },
  memoria:      { pos:"memoriosa",                          neg:"olvidadiza" },
  empatia:      { pos:"empática",                           neg:"distante frente al dolor ajeno" },
  confianza:    { pos:"confiada",                           neg:"recelosa" },
  autenticidad: { pos:"auténtica",                          neg:"acomodada a lo que otros quieren ver" },
  conciencia:   { pos:"consciente de lo invisible",         neg:"indiferente a lo que no la toca directamente" },
  legalidad:    { pos:"institucional",                      neg:"rebuscada" },
};

/* ============================================================
   ESTADO DEL JUEGO (equivalente a las variables $ del twee)
   ============================================================ */
function shuffled(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

class GameState {
  constructor(){ this.reset(); }
  reset(){
    this.stats = {};
    STAT_ORDER.forEach(s => this.stats[s]=0);
    this.visitadas = [];
    this.pool = shuffled(LOCATIONS);
    this.momento = null;
    this.currentNodeId = "Inicio";
  }
  applyEffects(effObj){
    if(!effObj) return;
    Object.entries(effObj).forEach(([k,v]) => { this.stats[k] = (this.stats[k]||0) + v; });
  }
  visitedCount(){ return this.visitadas.length; }
  total(){ return STAT_ORDER.reduce((a,s)=>a+this.stats[s],0); }
}

/* Polygon "entity" shape driven by the 8 stats — the visual mirror
   the concept doc describes: no numbers shown to the player, only form. */
function entityPolygonPoints(stats, baseRadius, cx, cy){
  const n = STAT_ORDER.length;
  const pts = [];
  for(let i=0;i<n;i++){
    const v = stats[STAT_ORDER[i]] || 0;
    const r = baseRadius + v * (baseRadius*0.18); // deform per point
    const angle = (Math.PI*2 * i/n) - Math.PI/2;
    pts.push({x: cx + r*Math.cos(angle), y: cy + r*Math.sin(angle)});
  }
  return pts;
}

/* ============================================================
   ESCENA: MAPA — racimos alrededor de la entidad central
   ============================================================ */
class MapScene extends Phaser.Scene {
  constructor(){ super('MapScene'); }
  create(){
    this.state = this.game.gState;
    const W = this.scale.width, H = this.scale.height;
    this.cameras.main.setBackgroundColor(PALETTE.night);

    this.add.text(W/2, 34, 'BOGOTÁ — CUERPO RIZOMÁTICO', {
      fontFamily: FONT_DISPLAY, fontSize: '26px', color: '#ece7dd', letterSpacing: 2
    }).setOrigin(0.5);

    this.add.text(W/2, 64,
      this.state.visitedCount() === 0
        ? 'La ciudad todavía no tiene forma. Elige una localidad para empezar a caminar.'
        : `Localidades caminadas: ${this.state.visitedCount()} / 8`,
      { fontFamily: FONT_MONO, fontSize: '13px', color: '#b9b3a6' }
    ).setOrigin(0.5);

    // --- entity polygon (signature element) ---
    const cx = W/2, cy = H/2 + 10, baseR = 46;
    this.entityGfx = this.add.graphics();
    this.drawEntity(cx, cy, baseR);

    // --- 8 location nodes around the entity ---
    const radius = Math.min(W,H) * 0.34;
    LOCATIONS.forEach((loc, i) => {
      const angle = (Math.PI*2 * i/8) - Math.PI/2;
      const x = cx + radius*Math.cos(angle);
      const y = cy + radius*Math.sin(angle);
      this.drawLocationNode(loc, x, y);
    });

    // --- finish button ---
    const finishBtn = this.add.text(W/2, H-30, this.state.visitedCount()>0 ? '[ Terminar aquí el recorrido ]' : '',
      { fontFamily: FONT_MONO, fontSize: '13px', color: '#f2a03d' }).setOrigin(0.5)
      .setInteractive({ useHandCursor:true });
    if(this.state.visitedCount()>0){
      finishBtn.on('pointerdown', () => this.scene.start('EndingScene'));
      finishBtn.on('pointerover', ()=>finishBtn.setColor('#4fd1c5'));
      finishBtn.on('pointerout', ()=>finishBtn.setColor('#f2a03d'));
    }
  }

  drawEntity(cx, cy, baseR){
    this.entityGfx.clear();
    const pts = entityPolygonPoints(this.state.stats, baseR, cx, cy);
    const total = this.state.total();
    const color = total > 0 ? PALETTE.accentCool : (total < 0 ? PALETTE.accentRust : 0x8892b0);
    this.entityGfx.lineStyle(2, color, 1);
    this.entityGfx.fillStyle(color, 0.12);
    this.entityGfx.beginPath();
    pts.forEach((p,i)=> i===0 ? this.entityGfx.moveTo(p.x,p.y) : this.entityGfx.lineTo(p.x,p.y));
    this.entityGfx.closePath();
    this.entityGfx.fillPath();
    this.entityGfx.strokePath();
    // core dot
    this.entityGfx.fillStyle(0xece7dd, 1);
    this.entityGfx.fillCircle(cx, cy, 4);
  }

  drawLocationNode(loc, x, y){
    const visited = this.state.visitadas.includes(loc);
    const available = this.state.pool.includes(loc) || (this.state.pool.length===0 && !visited && loc===this.state.pool[0]);
    const canVisit = this.state.pool.includes(loc);
    const stat = STAT_BY_LOCATION[loc];
    const val = this.state.stats[stat];

    let fill = 0x2b2f57, stroke = 0x565c8f;
    if(visited){
      fill = val>0 ? PALETTE.accentCool : (val<0 ? PALETTE.accentRust : 0x8892b0);
      stroke = fill;
    }

    const r = 22;
    const circle = this.add.circle(x, y, r, fill, visited?0.85:0.5).setStrokeStyle(2, stroke, 1);
    const label = this.add.text(x, y+r+12, loc, {
      fontFamily: FONT_DISPLAY, fontSize: '14px', color: visited ? '#ece7dd' : '#8892b0'
    }).setOrigin(0.5);

    if(canVisit){
      circle.setInteractive({ useHandCursor:true });
      circle.on('pointerover', ()=> circle.setStrokeStyle(3, PALETTE.accentWarm,1));
      circle.on('pointerout', ()=> circle.setStrokeStyle(2, stroke,1));
      circle.on('pointerdown', ()=> this.visitLocation(loc));
    }
  }

  visitLocation(loc){
    this.state.pool = this.state.pool.filter(l => l!==loc);
    this.state.momento = Math.random() < 0.5 ? 'Día' : 'Noche';
    this.state.visitadas.push(loc);
    this.state.currentNodeId = `${loc}: Entrada`;
    this.scene.start('DialogueScene');
  }
}

/* ============================================================
   ESCENA: DIÁLOGO — texto + decisiones
   ============================================================ */
class DialogueScene extends Phaser.Scene {
  constructor(){ super('DialogueScene'); }
  create(){
    this.state = this.game.gState;
    this.renderNode();
  }

  clearScene(){ this.children.removeAll(); }

  resolveText(node){
    if(!node.text) return '';
    if(typeof node.text === 'string') return node.text;
    return this.state.momento === 'Noche' ? node.text.night : node.text.day;
  }

  renderNode(){
    this.clearScene();
    const node = NODE_BY_ID[this.state.currentNodeId];
    const W = this.scale.width, H = this.scale.height;
    const isNight = this.state.momento === 'Noche';

    this.cameras.main.setBackgroundColor(isNight ? PALETTE.night : PALETTE.day);
    const inkColor = isNight ? '#ece7dd' : '#22201a';
    const dimColor = isNight ? '#8892b0' : '#6b6455';

    // location / moment header
    if(node.location){
      this.add.text(28, 24, node.location.toUpperCase(), {
        fontFamily: FONT_DISPLAY, fontSize: '20px', color: isNight ? '#f2a03d' : '#c1440e'
      });
      this.add.text(W-28, 24, isNight ? 'NOCHE' : 'DÍA', {
        fontFamily: FONT_MONO, fontSize: '12px', color: dimColor
      }).setOrigin(1,0);
    }

    let body = this.resolveText(node);
    if(node.extra_raw) body += '\n\n' + node.extra_raw;
    if(node.mood_reaction){
      const cond = this.evalMood(node.mood_reaction.condition);
      body += '\n\n' + (cond ? node.mood_reaction.text_true : node.mood_reaction.text_false);
    }
    if(node.reveal){
      const r = node.reveal;
      const v = this.state.stats[r.stat];
      body += '\n\n' + (v >= r.high_threshold ? r.text_high : (v <= r.low_threshold ? r.text_low : r.text_neutral));
    }
    if(node.memory_echo && this.evalEcho(node.memory_echo.condition)){
      body += '\n\n' + node.memory_echo.text;
    }

    this.add.text(36, 70, body, {
      fontFamily: FONT_BODY, fontSize: '16px', color: inkColor, wordWrap: { width: W-72 }, lineSpacing: 6
    });

    // choices
    const choices = node.choices || [];
    let cy = H - 26 - (choices.length-1)*40 - 20;
    if(choices.length===0){
      // system node fallback: auto-advance
      this.time.delayedCall(50, () => this.advanceSystem(node));
      return;
    }
    choices.forEach((c) => {
      const btn = this.add.text(36, cy, '→ ' + c.text, {
        fontFamily: FONT_DISPLAY, fontSize: '18px', color: isNight ? '#4fd1c5':'#c1440e'
      }).setInteractive({ useHandCursor:true });
      btn.on('pointerover', ()=>btn.setColor('#f2a03d'));
      btn.on('pointerout', ()=>btn.setColor(isNight ? '#4fd1c5':'#c1440e'));
      btn.on('pointerdown', ()=> this.choose(node, c));
      cy += 34;
    });
  }

  evalMood(cond){
    // e.g. "$tolerancia > 0"
    const m = cond.match(/\$(\w+)\s*([<>]=?)\s*(-?\d+)/);
    if(!m) return false;
    const [,stat,op,num] = m; const v = this.state.stats[stat]; const n = parseInt(num,10);
    switch(op){ case '>': return v>n; case '<': return v<n; case '>=': return v>=n; case '<=': return v<=n; }
    return false;
  }
  evalEcho(cond){
    const m = cond.match(/\$(\w+)\s*([<>])\s*0/);
    if(!m) return false;
    const [,stat,op] = m; const v = this.state.stats[stat];
    return op==='>' ? v>0 : v<0;
  }

  choose(node, choice){
    // apply effects for this node (day/night aware) before leaving it
    if(node.effects){
      if(node.effects.day || node.effects.night){
        this.state.applyEffects(this.state.momento==='Noche' ? node.effects.night : node.effects.day);
      } else {
        this.state.applyEffects(node.effects);
      }
    }
    this.state.currentNodeId = choice.target;
    const next = NODE_BY_ID[this.state.currentNodeId];
    if(next && next.type === 'hub'){
      this.scene.start('MapScene');
    } else {
      this.renderNode();
    }
  }

  advanceSystem(node){
    if(node.type === 'ending' || this.state.currentNodeId === 'Revelación final'){
      this.scene.start('EndingScene');
    } else {
      this.scene.start('MapScene');
    }
  }
}

/* ============================================================
   ESCENA: REVELACIÓN FINAL
   ============================================================ */
class EndingScene extends Phaser.Scene {
  constructor(){ super('EndingScene'); }
  create(){
    const state = this.state = this.game.gState;
    const W = this.scale.width, H = this.scale.height;
    this.cameras.main.setBackgroundColor(PALETTE.night);

    this.add.text(W/2, 40, 'REVELACIÓN', {
      fontFamily: FONT_DISPLAY, fontSize: '28px', color: '#ece7dd', letterSpacing: 2
    }).setOrigin(0.5);

    // final entity, larger
    const cx = W/2, cy = 150, baseR = 60;
    const gfx = this.add.graphics();
    const pts = entityPolygonPoints(state.stats, baseR, cx, cy);
    const total = state.total();
    const color = total > 0 ? PALETTE.accentCool : (total < 0 ? PALETTE.accentRust : 0x8892b0);
    gfx.lineStyle(2, color, 1); gfx.fillStyle(color, 0.15);
    gfx.beginPath(); pts.forEach((p,i)=> i===0?gfx.moveTo(p.x,p.y):gfx.lineTo(p.x,p.y));
    gfx.closePath(); gfx.fillPath(); gfx.strokePath();

    const traits = [];
    STAT_ORDER.forEach(s => {
      const v = state.stats[s];
      if(v>0) traits.push(TRAITS[s].pos);
      else if(v<0) traits.push(TRAITS[s].neg);
    });

    let desc = traits.length
      ? `Se puede describir, hoy, como alguien ${traits.join(', ')}.`
      : 'No terminó de inclinarse hacia ningún lado — todavía es, sobre todo, una posibilidad.';

    let totalTxt = total>=4
      ? 'Es, sobre todo, un reflejo amable de la ciudad: la parte de Bogotá que se detiene, que escucha, que confía un poco más de lo que le enseñaron.'
      : (total<=-4
        ? 'Es, sobre todo, un reflejo áspero de la ciudad: la parte que aprendió a no detenerse, a no confiar, a mirar para otro lado cuando algo incomoda.'
        : 'Es, sobre todo, un reflejo mixto — como la ciudad misma, que no es una sola cosa, sino muchas decisiones pequeñas superpuestas.');

    let completionTxt = state.visitedCount() >= 8
      ? 'Y así, sin buscarlo, terminaste de construir algo con cada esquina en la que decidiste algo, de día o de noche. Bogotá no te enseñó una lección — te dejó ocho, y tú decidiste cuáles aprender.'
      : `Y así, sin terminar de recorrerla toda (${state.visitedCount()} de 8 localidades), la ciudad ya alcanzó a dejar algo en ti.`;

    this.add.text(30, 230, `${desc}\n\n${totalTxt}\n\n${completionTxt}`, {
      fontFamily: FONT_BODY, fontSize: '15px', color: '#ece7dd', wordWrap:{width: W-60}, lineSpacing:6
    });

    const again = this.add.text(W/2, H-30, '[ Volver a empezar ]', {
      fontFamily: FONT_MONO, fontSize: '13px', color: '#f2a03d'
    }).setOrigin(0.5).setInteractive({useHandCursor:true});
    again.on('pointerdown', ()=>{ this.game.gState.reset(); this.scene.start('MapScene'); });
  }
}

/* ============================================================
   ESCENA: INICIO
   ============================================================ */
class BootScene extends Phaser.Scene {
  constructor(){ super('BootScene'); }
  create(){
    this.game.gState = new GameState();
    const W = this.scale.width, H = this.scale.height;
    this.cameras.main.setBackgroundColor(PALETTE.night);
    this.add.text(W/2, H/2-40, 'CIUDADES EXPANDIDAS', {
      fontFamily: FONT_DISPLAY, fontSize:'34px', color:'#ece7dd', letterSpacing:3
    }).setOrigin(0.5);
    this.add.text(W/2, H/2, 'Bogotá como cuerpo rizomático', {
      fontFamily: FONT_BODY, fontStyle:'italic', fontSize:'16px', color:'#b9b3a6'
    }).setOrigin(0.5);
    const start = this.add.text(W/2, H/2+60, '[ Empezar a caminar ]', {
      fontFamily: FONT_MONO, fontSize:'14px', color:'#f2a03d'
    }).setOrigin(0.5).setInteractive({useHandCursor:true});
    start.on('pointerover', ()=>start.setColor('#4fd1c5'));
    start.on('pointerout', ()=>start.setColor('#f2a03d'));
    start.on('pointerdown', ()=> this.scene.start('MapScene'));
  }
}
